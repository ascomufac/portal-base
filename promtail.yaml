server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s

    pipeline_stages:
      - docker: {}

    relabel_configs:
      # Nome do container como label 'container_name'
      - source_labels: [__meta_docker_container_name]
        target_label: container_name

      # Nome da imagem como 'image'
      - source_labels: [__meta_docker_image_name]
        target_label: image

      # ID do container
      - source_labels: [__meta_docker_container_id]
        target_label: container_id

      # Nome do serviço no Swarm, se estiver usando
      - source_labels: [__meta_docker_container_label_com_docker_swarm_service_name]
        target_label: swarm_service

      # Definir o 'job' com o nome do container (isso é o que vai aparecer nas queries do Loki)
      - source_labels: [__meta_docker_container_name]
        target_label: job
