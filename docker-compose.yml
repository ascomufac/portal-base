version: "4.1"
services:
  webserver:
    image: traefik:v2.9

    ports:
      - "80:80"
      - "443:443"
      - "8082:8082" # Alterando a porta de métricas

    command:
      - "--api=true"
      #- "--api.insecure=true" # Permite acessar o dashboard sem autenticação
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.metrics.address=:8082" 
      - "--entrypoints.websecure.http.tls=true"
      - "--certificatesresolvers.myresolver.acme.tlschallenge=true"
      - "--certificatesresolvers.myresolver.acme.email=ascom@ufac.br"
      - "--certificatesresolvers.myresolver.acme.storage=/certs/acme.json"
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.entrypoint=metrics"
      - "--accesslog=true"
      - "--accesslog.filepath=/var/log/traefik/access.log"

    labels:
    # Redirecionar HTTP para HTTPS
    - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
    - "traefik.http.routers.http-catchall.rule=Host(`www3.ufac.br`)"
    - "traefik.http.routers.http-catchall.entrypoints=web"
    - "traefik.http.routers.http-catchall.middlewares=redirect-to-https"

     # Roteador do Traefik para o dashboard
    - "traefik.http.routers.traefik.rule=Host(`localhost`)"
    - "traefik.http.routers.traefik.service=api@internal"
    - "traefik.http.routers.traefik.entrypoints=websecure"
    - "traefik.http.routers.traefik.tls.certresolver=myresolver"

    # Middleware para Plone/Varnish
    # - "traefik.http.middlewares.vhm-portal.headers.customrequestheaders.X-VirtualHost-Monster=1"

    # Middleware de proteção contra bots
    - "traefik.http.middlewares.limit-bot.ratelimit.average=5"
    - "traefik.http.middlewares.limit-bot.ratelimit.burst=10"
    - "traefik.http.middlewares.block-scrapy.headers.customrequestheaders.User-Agent=BLOCKED"
    - "traefik.http.routers.backend.middlewares=vhm-portal,limit-bot,block-scrapy"

    
      # Matomo
    #- "traefik.http.routers.matomo.rule=Host(`www3.ufac.br`)"
    #- "traefik.http.routers.matomo.entrypoints=websecure"
    #- "traefik.http.routers.matomo.tls=true"
    #- "traefik.http.services.matomo.loadbalancer.server.port=80"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /usr/local/plone/cert:/certs
      - /usr/local/plone/logs/traefik:/var/log/traefik
      
  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana

  loki:
    image: grafana/loki:2.9.3
    container_name: loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    networks:
      - default
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml
      - ./loki-data:/loki

  promtail:
    image: grafana/promtail:2.9.3
    container_name: promtail
    depends_on:
      - loki
    command: -config.file=/etc/promtail/promtail.yaml
    networks:
      - default
    volumes:
      - /var/log:/var/log
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./promtail.yaml:/etc/promtail/promtail.yaml

  matomo:
    image: matomo
    container_name: matomo
    restart: always
    ports:
     - "8083:80"
    volumes:
      - matomo_data:/var/www/html
    depends_on:
      - db
    environment:
      MATOMO_DATABASE_HOST: matomo-db
      MATOMO_DATABASE_ADAPTER: mariadb
      MATOMO_DATABASE_USERNAME: capivara
      MATOMO_DATABASE_PASSWORD: capi.ufac
      MATOMO_DATABASE_DBNAME: matomo
      MATOMO_URL_PATH: /matomo
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.matomo.rule=Host(`www3.ufac.br`) && PathPrefix(`/matomo`)"
      - "traefik.http.routers.matomo.entrypoints=websecure"
      - "traefik.http.routers.matomo.tls.certresolver=myresolver"
  db:
    image: mariadb:11.7
    container_name: matomo-db
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: ufac1.capivara
      MARIADB_DATABASE: matomo
      MARIADB_USER: capivara
      MARIADB_PASSWORD: capi.ufac
    volumes:
      - db_data:/var/lib/mysql

  editais:
    image: ghcr.io/ascomufac/portal-editais-frontend:latest
    ports:
      - '3003:80'
    restart: always
    labels:
      - traefik.enable=true
      - traefik.http.services.plone-editais.loadbalancer.server.port=3003
      - traefik.http.middlewares.gzip.compress=true
      #- traefik.http.routers.editais.rule=Host(`www3.ufac.br`) && PathPrefix(`/editais`)
      - traefik.http.routers.editais.service=plone-editais
      - traefik.http.routers.editais.middlewares=gzip

  #https://grafana.com/grafana/dashboards/9903-varnish/
  # varnish:
  #   image: varnish:stable
  #   ports:
  #     - "8081:80"
  #   depends_on:
  #     - backend
  #   environment:
  #     VARNISH_BACKEND_HOST: backend
  #     VARNISH_BACKEND_PORT: 8080
  #   labels:
  #     - traefik.enable=true
  #     - traefik.http.routers.varnish.rule=Host(`www3.ufac.br`) && PathPrefix(`/editais`)
  #     - traefik.http.routers.varnish.entrypoints=websecure
  #     - traefik.http.routers.varnish.tls=true
  #     - traefik.http.routers.varnish.tls.certresolver=myresolver
  #   volumes:
  #     - ./default.vcl:/etc/varnish/default.vcl
  #     - varnish_shared:/var/lib/varnish

  # varnish-exporter:
  #   image: quay.io/prometheuscommunity/varnish-exporter:latest
  #   container_name: varnish-exporter
  #   command:
  #     - -web.listen-address=:9131
  #     - -varnishstat.path=/usr/bin/varnishstat
  #     - -varnishstat.args=-n /var/lib/varnish
  #   depends_on:
  #     - varnish
  #   ports:
  #     - "9131:9131"
  #   volumes:
  #     - varnish_shared:/var/lib/varnish
  #   networks:
  #     - default
      
  backend:
    image: plone/plone-backend:6.0.12
    #deploy:
    #  replicas: 3
    environment:
    #  SITE: Plone
    # https://github.com/collective/collective.prometheus
      CORS_ALLOW_ORIGIN: '*'
      #ADDONS: "collective.exportimport"
      TZ: America/Rio_Branco
    ports:
      - 8080:8080
    command: >
      start --threads=8 --max-connections=2000 --asyncore-use-poll
    labels:
      - traefik.enable=true
      - traefik.constraint-label=public
      # Service
      - traefik.http.services.svc-backend.loadbalancer.server.port=8080
      - traefik.http.middlewares.gzip.compress=true
      - "traefik.http.routers.backend.rule=Host(`www3.ufac.br`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls=true"
      - "traefik.http.routers.backend.tls.certresolver=myresolver"
      - "traefik.http.routers.backend.middlewares=vhm-portal,limit-bot"
      # Virtual Host Monster configuration
      - "traefik.http.middlewares.vhm-portal.replacepathregex.regex=^/(.*)"
      - "traefik.http.middlewares.vhm-portal.replacepathregex.replacement=/VirtualHostBase/https/www3.ufac.br/editais/VirtualHostRoot/$$1"
      - "traefik.http.middlewares.vhm-editais.replacepathregex.regex=^/editais(.*)"
      - "traefik.http.middlewares.vhm-editais.replacepathregex.replacement=/VirtualHostBase/https/www3.ufac.br/editais/VirtualHostRoot/$$1"
      - "traefik.http.routers.backend.middlewares=vhm-portal"
      - "traefik.http.routers.editais.middlewares=vhm-editais"
      
    volumes:
      - data:/data

volumes:
  data:
  grafana_data:
  matomo_data:
  db_data:
  varnish_shared:
