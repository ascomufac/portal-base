version: "4.1"

services:

  webserver:
    image: traefik:v2.9
    restart: always

    ports:
      - "80:80"
      - "443:443"
      - "8082:8082"

    command:
      - "--api=true"
      - "--api.dashboard=true"
      - "--providers.docker=true"

      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.metrics.address=:8082"

      - "--entrypoints.websecure.http.tls=true"

      - "--certificatesresolvers.myresolver.acme.tlschallenge=true"
      - "--certificatesresolvers.myresolver.acme.email=ascom@ufac.br"
      - "--certificatesresolvers.myresolver.acme.storage=/certs/acme.json"

      - "--metrics.prometheus=true"
      - "--metrics.prometheus.entrypoint=metrics"

      - "--accesslog=true"
      - "--accesslog.filepath=/var/log/traefik/access.log"

    labels:
      # HTTP → HTTPS
      - "traefik.http.routers.http-catchall.rule=Host(`www3.ufac.br`)"
      - "traefik.http.routers.http-catchall.entrypoints=web"
      - "traefik.http.routers.http-catchall.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"

      # HTTPS / → /editais
      - "traefik.http.routers.root-redirect.rule=Host(`www3.ufac.br`) && Path(`/`)"
      - "traefik.http.routers.root-redirect.entrypoints=websecure"
      - "traefik.http.routers.root-redirect.tls=true"
      - "traefik.http.routers.root-redirect.middlewares=redirect-to-editais"

      - "traefik.http.middlewares.redirect-to-editais.redirectregex.regex=^https://www3.ufac.br/?$"
      - "traefik.http.middlewares.redirect-to-editais.redirectregex.replacement=https://www3.ufac.br/editais"
      - "traefik.http.middlewares.redirect-to-editais.redirectregex.permanent=true"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /usr/local/plone/cert:/certs
      - /usr/local/plone/logs/traefik:/var/log/traefik

  varnish:
    image: varnish:7.4
    restart: always
    depends_on:
      - backend
    volumes:
      - ./varnish.vcl:/etc/varnish/default.vcl:ro
    command: >
      varnishd -F
      -f /etc/varnish/default.vcl
      -s malloc,1g
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.varnish.rule=Host(`www3.ufac.br`)"
      - "traefik.http.routers.varnish.entrypoints=websecure"
      - "traefik.http.routers.varnish.tls=true"
      - "traefik.http.routers.varnish.tls.certresolver=myresolver"
      - "traefik.http.services.varnish.loadbalancer.server.port=80"

  zeo:
    image: plone/plone-zeo:6.0
    restart: always
    volumes:
      - data:/data

  backend:
    image: plone/plone-backend:6.0.12
    restart: always

    environment:
      CORS_ALLOW_ORIGIN: '*'
      ZEO_ADDRESS: zeo:8100
      WAITRESS_THREADS: 4
      TZ: America/Rio_Branco

    command: >
      start --threads=8 --max-connections=300

    depends_on:
      - zeo
  
  editais:
    image: ghcr.io/ascomufac/portal-editais-frontend:${EDITAIS_IMAGE_TAG:-latest}
    ports:
      - '3003:8080'
    restart: always
    labels:
      - traefik.enable=false
    environment:
      RAZZLE_INTERNAL_API_PATH: http://backend:8080/editais
      RAZZLE_API_PATH: http://www3.ufac.br/editais
      RAZZLE_DEV_PROXY_API_PATH: http://backend:8080/editais
    depends_on:
      - backend
    volumes:
      - ./frontend/src/addons:/src/addons

  portal:
    image: ghcr.io/ascomufac/novo-portal-ufac-frontend:${PORTAL_IMAGE_TAG:-latest}
    ports:
      - '3001:4000'
    restart: always
    labels:
      - traefik.enable=false
    environment:
      RAZZLE_INTERNAL_API_PATH: http://backend:8080/portal
      RAZZLE_API_PATH: http://www3.ufac.br/portal
      RAZZLE_DEV_PROXY_API_PATH: http://backend:8080/portal
      PORT: "4000"
      NG_ALLOWED_HOSTS: "${PORTAL_ALLOWED_HOSTS:-www3.ufac.br,localhost,127.0.0.1}"
      BACKEND_URL: http://backend:8080
      TZ: America/Rio_Branco
    depends_on:
      - backend
    volumes:
      - ./frontend/src/addons:/src/addons

  backend-admin:
    image: plone/plone-backend:6.0.12
    restart: always
  
    ports:
      - "127.0.0.1:8080:8080"
  
    environment:
      CORS_ALLOW_ORIGIN: '*'
      ZEO_ADDRESS: zeo:8100
      WAITRESS_THREADS: 2
      TZ: America/Rio_Branco
  
    command: >
      start --threads=4 --max-connections=100
  
    depends_on:
      - zeo

volumes:
  data: